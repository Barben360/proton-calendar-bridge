version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
  # Tests (and their helpers, in _test.go files) use throwaway connections and
  # requests that the test's own cleanup closes: the context, body and error
  # swallowing rules would only add noise there. A failed type assertion on a
  # decoded JSON reply panics and so fails the test, which is the point of the
  # test: forcetypeassert would only force noise there.
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - nilerr
          - noctx
          - forcetypeassert
      # gosec in tests: fixtures are written and read in t.TempDir() with
      # whatever mode the test wants, subprocesses and servers are the test's
      # own, and the secret-looking names are fakes. The production code is
      # what gosec guards.
      - path: _test\.go
        linters:
          - gosec
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    # A switch over an enum with a default is exhaustive: the code base states
    # the fallback of a state there, and listing every constant
    # of a state it handles alike would only add dead cases. A switch with no
    # default must name every constant.
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        # G304 (file inclusion via variable): every path pcb opens comes from
        # its own configuration, state directory or the person's command line
        # (a calendar, a config file, a state root): by design, never from a
        # remote peer. The remaining rules stay on.
        - G304
        # G103 (unsafe): only the Windows code uses it, to hand a struct or
        # buffer to a Win32 call (syscall.Proc.Call, the x/sys/windows
        # signatures), which cannot be written without unsafe.Pointer.
        - G103
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Barben360/proton-calendar-bridge
