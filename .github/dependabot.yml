version: 2
updates:
  # Pull request titles must start with a gitmoji (pr-title.yml): every
  # Dependabot title starts with ⬆️ ("⬆️ Bump …").
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    # go-proton-api needs Proton's forks of these two modules; their versions
    # carry a -proton suffix, which Dependabot reads as a pre-release and
    # "bumps" to the upstream release, dropping Proton's patches.
    ignore:
      - dependency-name: github.com/ProtonMail/go-crypto
      - dependency-name: github.com/ProtonMail/gopenpgp/v2
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
  # The Dockerfile's golang and distroless digests only; the Makefile's and
  # image-build.yml's pinned digests are bumped by hand (docs/development.md).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
