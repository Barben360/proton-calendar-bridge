version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Dockerfile's golang and distroless digests only; the Makefile's and
  # image-build.yml's pinned digests are bumped by hand (docs/development.md).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
