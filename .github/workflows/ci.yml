name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Each job keeps its own Go build and module cache (actions/cache below, keyed
# by job, shard, Go version and go.sum): with setup-go's single shared key the
# first job to finish (systemd-smoke, a plain CGO_ENABLED=0 build) won the save,
# so every -race, cgo and GOOS=windows build compiled from scratch. A restored
# build cache also holds test results: -count=1 makes every test run (go
# commands that lack -count ignore it in GOFLAGS).
env:
  GOFLAGS: -count=1
jobs:
  secrets:
    # gitleaks over the whole history of the commit under test on every run:
    # small, and immune to the push ranges gitleaks-action builds (on the
    # first push of a repository it asked for the root commit's parent and
    # scanned nothing). --log-opts=HEAD keeps it to that history: by default
    # gitleaks scans --all, every branch the full checkout fetched, so a
    # finding on an unmerged branch failed main and every other pull request.
    # A test fixture that looks like a secret carries an inline
    # "gitleaks:allow" with the reason; a false positive already committed
    # goes in .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 --log-opts=HEAD .'

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Install the GL and X development headers
        # golangci-lint type-checks cmd/pcb-ui with cgo (Fyne).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libwayland-dev libxkbcommon-dev xorg-dev
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make lint
      - name: Known vulnerabilities (govulncheck, pinned)
        run: make vulncheck
      - name: Live-session guard
        run: |
          make live-preflight-test
          make shellcheck
      - name: Release and install scripts, workflow lint
        run: make release-test install-test vmtest-test actionlint
      - name: Vet for Windows
        run: GOOS=windows go vet ./...
      - name: Build is stamped
        run: |
          make build
          if bin/pcb version --json | grep -q '"version": "dev"'; then
            echo "make build did not stamp the version" >&2
            exit 1
          fi
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The two heaviest packages (real SRP logins under -race) each get a
        # runner of their own: together on one 4-core runner, service alone
        # took 578 s of the 600 s go test default. The shards cover ./...
        shard: [service, cli, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Race tests
        run: |
          # cmd/pcb-ui needs cgo and the GL headers: the ui job runs it.
          heavy='internal/(service|cli)$|cmd/pcb-ui$'
          case "${{ matrix.shard }}" in
            service) pkgs=$(go list ./internal/service) ;;
            cli) pkgs=$(go list ./internal/cli) ;;
            *) pkgs=$(go list ./... | grep -vE "$heavy" | tr "\n" " ") ;;
          esac
          test -n "$pkgs"
          make test PKGS="$pkgs"
  # pcb-ui, the desktop app (M7): built with cgo against the GL/X headers; its
  # tests, and the sealer's, start private buses (dbus-daemon, from dbus).
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Install the GL and X development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libwayland-dev libxkbcommon-dev xorg-dev dbus dbus-x11 xvfb x11-utils
      - run: make ui
      - name: pcb-ui starts far enough to print its version
        run: xvfb-run -a bin/pcb-ui --version
      - name: UI and seal tests (each bus test starts its own private bus)
        run: make test PKGS="./cmd/pcb-ui ./internal/ui/... ./internal/store/seal/... ./internal/dbustest"
  # pcb install --user and --system in a Debian container with systemd as
  # PID 1 (M5-P21): GitHub runners allow --privileged --cgroupns=host.
  systemd-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - run: make systemd-smoke
  # The live session rehearsed offline (plan R2): the real pcb against
  # pcb-fake on 127.0.0.1. Only the module download uses the network; the
  # rehearsal fences everything but loopback.
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Download modules
        run: go mod download
      - run: make rehearse
  # The installer on a Mac: the darwin archive built and packaged as the
  # release does, installed by install.sh from a file:// release, then run.
  # No actions/cache: the build is short, and the runner's cache paths differ.
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install GNU tar
        # package.sh needs GNU tar (--sort, --mtime): macOS has bsdtar. gtar's
        # gnubin directory (tar without the g) goes first on PATH from here on.
        # Not pinned: brew installs only the formula's current version (it
        # has no versioned gnu-tar@X formula), so the version is logged.
        run: |
          brew install gnu-tar
          command -v gtar >/dev/null || { echo "::error::brew install gnu-tar left no gtar on PATH"; exit 1; }
          gtar --version | head -1
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build and package darwin
        run: |
          case $(uname -m) in
            x86_64) arch=amd64 ;;
            *) arch=arm64 ;;
          esac
          make build VERSION=v0.0.0-ci
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) scripts/release/package.sh darwin "$arch" bin dist
          cp scripts/install.sh dist/install.sh
          (cd dist && shasum -a 256 "pcb_darwin_${arch}.tar.gz" install.sh > checksums.txt)
      - name: Install smoke
        run: scripts/release/macos-smoke.sh dist v0.0.0-ci
      - name: The smoke fails on a wrong version
        # The archive's pcb reports v0.0.0-ci: asking for another tag must fail.
        run: |
          if out=$(scripts/release/macos-smoke.sh dist v0.0.0-wrong 2>&1); then
            echo "$out"
            echo "the smoke passed on a wrong version" >&2
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -qF "pcb version reports 'v0.0.0-ci', want 'v0.0.0-wrong'"
      - name: install.sh tests on the macOS shell
        run: sh scripts/install_test.sh
  # Both binaries on Windows (the Windows port): pcb and pcb-ui are built and
  # run, packed into the MSI, which the smoke script installs, repairs,
  # upgrades and uninstalls (decision 0020), and the tests run natively. MinGW-w64 (UCRT64, the toolchain of the
  # release's ui-windows job) gives cgo its gcc and the steps their make; with
  # path-type: inherit the runner's go stays on PATH, and so does its jq (from the
  # runner image, not an msys2 package: a change of image shows up there). The runner's user
  # is an elevated administrator: tests that only hold for a standard user
  # skip themselves when acl.Elevated() reports true.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Vet
        shell: msys2 {0}
        run: CGO_ENABLED=1 go vet ./...
      - name: Build pcb and pcb-ui
        shell: msys2 {0}
        # v0.0.0-ci: the MSI of a build that is not a tag is 0.0.0, and the
        # smoke checks that the installed binaries report that version.
        run: make build ui VERSION=v0.0.0-ci
      - name: pcb version and doctor
        shell: msys2 {0}
        run: |
          bin/pcb.exe version --json | jq -e '.data.os == "windows"'
          rc=0; bin/pcb.exe doctor --json > doctor.json || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 10 ] || { echo "::error::pcb doctor exited $rc"; cat doctor.json; exit 1; }
          jq -e '.data.results[] | select(.name == "platform") | .status == "ok" and .message == "windows/amd64"' doctor.json
      - name: pcb-ui prints its version and carries its resources
        shell: msys2 {0}
        run: |
          # A GUI-subsystem binary: its output reaches a file only when redirected.
          bin/pcb-ui.exe --version > v.txt
          cat v.txt
          grep -q '^pcb-ui ' v.txt
          powershell -NoProfile -Command '(Get-Item bin/pcb-ui.exe).VersionInfo.ProductName' | tr -d '\r' | grep -qx 'pcb-ui'
      # release.yml's msi and windows-smoke jobs run check.sh directly under
      # their default shell, bash: Git for Windows' bash, not MSYS2's.
      - name: check.sh msi-version runs under Git Bash, as in the release
        shell: bash
        run: |
          v=$(scripts/release/check.sh msi-version v0.2.0-rc.1)
          [ "$v" = 0.2.0 ] || { echo "::error::check.sh msi-version v0.2.0-rc.1 printed '$v' under Git Bash, want 0.2.0"; exit 1; }
      # WiX 7.0.1 exactly (decision 0020), a .NET tool from nuget.org: the
      # runner image's .NET SDK installs it. The release's msi job runs the
      # same script.
      - name: Install WiX 7.0.1 and its UI and Util extensions
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\win\install-wix.ps1
      # Twice: the second build (another ProductCode, the same UpgradeCode)
      # is the smoke's major upgrade. MSI_TAG v0.0.0-ci goes through
      # check.sh msi-version's tag parsing, as a release's tag: 0.0.0.
      - name: Build the MSI (make msi, with the ICE checks)
        shell: msys2 {0}
        run: |
          make msi MSI_TAG=v0.0.0-ci
          mkdir -p bin/upgrade
          mv bin/pcb_windows_amd64.msi bin/upgrade/
          make msi MSI_TAG=v0.0.0-ci
          ls -l bin/pcb_windows_amd64.msi bin/upgrade/pcb_windows_amd64.msi
      # msiexec /a only unpacks the files; the release runs the same script
      # against the zip's binaries.
      - name: The MSI holds exactly bin's pcb.exe and pcb-ui.exe
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\win\msi-contents.ps1 -Msi bin\pcb_windows_amd64.msi -Dir bin
      # pcb-ui.exe in the place of pcb.exe: the check must refuse it.
      - name: The contents check fails on another pcb.exe
        shell: pwsh
        run: |
          $wrong = Join-Path $env:RUNNER_TEMP 'wrong-bin'
          New-Item -ItemType Directory -Path $wrong | Out-Null
          Copy-Item -LiteralPath bin\pcb-ui.exe -Destination (Join-Path $wrong 'pcb-ui.exe')
          Copy-Item -LiteralPath bin\pcb-ui.exe -Destination (Join-Path $wrong 'pcb.exe')
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\win\msi-contents.ps1 -Msi bin\pcb_windows_amd64.msi -Dir $wrong
          $code = $LASTEXITCODE
          $out
          if ($code -ne 1) { Write-Output "::error::msi-contents.ps1 exited $code on another pcb.exe, want 1"; exit 1 }
          if (-not ($out -match '^msi-contents: FAIL the MSI''s pcb\.exe is not ')) { Write-Output '::error::msi-contents.ps1 did not name pcb.exe'; exit 1 }
          exit 0
      # The runner's user is an elevated administrator and reaches the
      # Windows Installer service directly; the MSI still installs per user.
      - name: The MSI smoke fails on a wrong version
        shell: pwsh
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\win\msi-smoke.ps1 -Msi bin\pcb_windows_amd64.msi -Version 9.9.9
          $code = $LASTEXITCODE
          $out
          if ($code -eq 0) { Write-Output '::error::the MSI smoke passed on a wrong version'; exit 1 }
          if (-not ($out -match '^FAIL ProductVersion is 9\.9\.9: ProductVersion is \[0\.0\.0\]$')) { Write-Output '::error::the MSI smoke did not fail on the version'; exit 1 }
          exit 0
      - name: MSI smoke (install, repairs, features, upgrade, uninstall)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\win\msi-smoke.ps1 -Msi bin\pcb_windows_amd64.msi -Version 0.0.0 -UpgradeMsi bin\upgrade\pcb_windows_amd64.msi
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The shards of the test job (the two heavy packages alone).
        shard: [service, cli, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: go-${{ github.job }}-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Race tests
        shell: msys2 {0}
        run: |
          # The tests make their directories in the temp directory, and pcb
          # refuses a directory whose access list lets CREATOR OWNER in. The
          # msys2 shell's /tmp (D:\a\_temp\msys64\tmp) inherits such an entry
          # from D:\a; the user profile's temp directory, where a user's own
          # files live, does not.
          TMP=$(cygpath -w "$LOCALAPPDATA/Temp")
          export TMP TEMP=$TMP
          case "${{ matrix.shard }}" in
            service) pkgs=./internal/service ;;
            cli) pkgs=./internal/cli ;;
            *) pkgs="./internal/filelock ./internal/ctl ./internal/paths ./internal/store/... ./internal/tlsutil ./internal/doctor ./internal/shellquote ./internal/atomicfile ./internal/access ./internal/acl ./internal/winzone ./internal/runkey ./internal/wingui ./internal/daemon ./internal/mcp ./internal/ui/... ./cmd/pcb ./cmd/pcb-fake ./cmd/pcb-ui/..." ;;
          esac
          # shellcheck disable=SC2086
          CGO_ENABLED=1 go test -race -timeout 20m $pkgs
