name: image-build
# The one image build (§5.2 of the release process design), called by
# image.yml (by hand: sha-<12 hex>) and release.yml (a release tag). Each
# architecture builds on its native runner and is pushed untagged, by
# digest; the tags go on one manifest list over both digests, then a build
# provenance attestation and an SBOM attestation are pushed beside it.
#
# The digests on the list are the ones smoke-tested, and no temporary tag is
# ever pushed: each build job pushes its image by digest only (BuildKit's
# push-by-digest, no tag), pulls that very digest back and smoke-tests it,
# and hands the digest on only when the smoke test passed. The list is made
# from those digests (imagetools create), and the publish job checks that
# the list holds exactly them. A failed smoke test leaves an untagged
# version in the package, never a tag.
on:
  workflow_call:
    secrets:
      PCB_REPORT_DSN:
        description: The crash report address stamped into pcb. Optional; without it the image has no reporting.
        required: false
    inputs:
      ref:
        description: The commit to build, a full SHA.
        type: string
        required: true
      version:
        description: Stamped into pcb and into the org.opencontainers.image.version label.
        type: string
        required: true
      tags:
        description: The tags to put on the manifest list, newline-separated, without the repository.
        type: string
        required: true
      owner-only:
        description: Refuse unless the run's actor and triggering actor are the repository owner.
        type: boolean
        required: false
        default: false
    outputs:
      digest:
        description: The manifest list's digest.
        value: ${{ jobs.publish.outputs.digest }}
permissions:
  contents: read
env:
  REPO: ghcr.io/barben360/proton-calendar-bridge
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # One output per architecture: matrix legs setting the same name would
    # overwrite each other.
    outputs:
      digest-amd64: ${{ steps.handoff.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.handoff.outputs.digest-arm64 }}
    env:
      # A BuildKit of our own (docker-container driver), pinned: the
      # runner's docker driver pushes by digest only with the containerd
      # image store, which a runner image need not use.
      BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      BUILDX_BUILDER: pcb
    steps:
      - name: Check the inputs
        env:
          REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ $REF =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref is not a full commit SHA: $REF"; exit 1; }
          [[ $VERSION =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || { echo "::error::not a version: $VERSION"; exit 1; }
      # release.yml: "Re-run failed jobs" on a failed image job skips its
      # checks job, and with it the owner check; this one runs again,
      # before any code of inputs.ref is checked out.
      # Same check: publish, sbom and attest-sbom below, release.yml's
      # checks and release jobs.
      - name: Refuse an image started by anyone but the owner
        if: inputs.owner-only
        run: |
          for a in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            [ "$a" = "$GITHUB_REPOSITORY_OWNER" ] || { echo "::error::$a is not $GITHUB_REPOSITORY_OWNER: only the owner releases"; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The tags are put on the list by publish; a bad one fails here,
      # before anything is built or pushed.
      - name: Check the tags
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          scripts/release/check.sh image-tag-list <<<"$TAGS" >/dev/null 2>"$RUNNER_TEMP/tags.err" || { echo "::error::tags input: $(cat "$RUNNER_TEMP/tags.err")"; exit 1; }
      - name: Set up the builder
        run: docker buildx create --name "$BUILDX_BUILDER" --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --bootstrap
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push by digest, untagged
        id: build
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
          REPORT_DSN: ${{ secrets.PCB_REPORT_DSN }}
        run: |
          meta="$RUNNER_TEMP/build-metadata.json"
          # No BuildKit attestations: the image is a single manifest, and
          # its provenance is the publish job's attestation. The revision
          # label is the full SHA (--label overrides the Dockerfile's);
          # pcb version keeps the short commit make stamps.
          make image IMAGE="$REPO" VERSION="$VERSION" \
            IMAGE_FLAGS="--provenance=false --sbom=false --label org.opencontainers.image.revision=$REF --output type=image,push-by-digest=true,name-canonical=true,push=true --metadata-file $meta"
          digest=$(jq -r '."containerimage.digest" // ""' "$meta")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest in the build metadata"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Pull that digest and smoke-test it
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="$REPO@$DIGEST"
          docker pull "$image"
          got=$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$image")
          [ "$got" = "linux/$ARCH" ] || { echo "::error::$image is $got, want linux/$ARCH"; exit 1; }
          PCB_SMOKE_IMAGE="$image" PCB_SMOKE_VERSION="$VERSION" PCB_SMOKE_REVISION="$REF" scripts/container-smoke.sh
      - name: Hand the smoke-tested digest on
        id: handoff
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: echo "digest-$ARCH=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Log out
        if: always()
        run: docker logout ghcr.io

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.list.outputs.digest }}
    # No checkout: this job holds id-token and attestations, so it runs no
    # code of any ref; its checks are inline.
    steps:
      # "Re-run failed jobs" on a failed publish runs this job and the jobs
      # after it (sbom, attest-sbom).
      # Same check: the build job above, sbom and attest-sbom below,
      # release.yml's checks and release jobs.
      - name: Refuse an image started by anyone but the owner
        if: inputs.owner-only
        run: |
          for a in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            [ "$a" = "$GITHUB_REPOSITORY_OWNER" ] || { echo "::error::$a is not $GITHUB_REPOSITORY_OWNER: only the owner releases"; exit 1; }
          done
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Tag one manifest list over both digests
        id: list
        env:
          TAGS: ${{ inputs.tags }}
          AMD64: ${{ needs.build.outputs.digest-amd64 }}
          ARM64: ${{ needs.build.outputs.digest-arm64 }}
        run: |
          for d in "$AMD64" "$ARM64"; do
            [[ $d =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::an architecture's digest is missing: '$d'"; exit 1; }
          done
          # The grammar of check.sh image-tag-list, which the build job ran
          # (check_test.sh checks both say the same).
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [[ $tag =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::not an image tag: '$tag'"; exit 1; }
            args+=(-t "$REPO:$tag")
          done <<<"$TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::no tag given"; exit 1; }
          meta="$RUNNER_TEMP/list-metadata.json"
          docker buildx imagetools create --metadata-file "$meta" "${args[@]}" "$REPO@$AMD64" "$REPO@$ARM64"
          digest=$(jq -r '."containerimage.descriptor".digest // ""' "$meta")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no manifest list digest in the metadata"; exit 1; }
          got=$(docker buildx imagetools inspect --raw "$REPO@$digest" | jq -r '[.manifests[].digest] | sort | join(" ")')
          want=$(printf '%s\n' "$AMD64" "$ARM64" | sort | paste -sd ' ')
          [ "$got" = "$want" ] || { echo "::error::the list holds $got, want the smoke-tested $want"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ steps.list.outputs.digest }}
          push-to-registry: true
          # Storage records exist for organisation-owned repositories only.
          create-storage-record: false
      - name: Log out
        if: always()
        run: docker logout ghcr.io

  # The SBOM (SPDX) of the pushed image, attested to the list's digest as a
  # registry referrer: unlike a BuildKit SBOM, it leaves the image manifests
  # untouched. Syft (a downloaded binary) runs here, in a job that holds no
  # id-token and no attestations, never in publish; the attest job below
  # takes only the file. The SBOM is read from the linux/amd64 image
  # (SYFT_PLATFORM): the Go modules are the same on every platform.
  sbom:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - name: Refuse an image started by anyone but the owner
        if: inputs.owner-only
        run: |
          for a in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            [ "$a" = "$GITHUB_REPOSITORY_OWNER" ] || { echo "::error::$a is not $GITHUB_REPOSITORY_OWNER: only the owner releases"; exit 1; }
          done
      # Read-only login: the job's token has packages: read only.
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The action writes output-file without creating its directory.
      - name: The SBOM's directory exists
        run: mkdir -p "$RUNNER_TEMP/sbom"
      # "registry:" makes syft pull by digest, never from a daemon. Syft is
      # pinned, not the action's default (as in release.yml).
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: registry:${{ env.REPO }}@${{ needs.publish.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom/image.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Not "sbom": release.yml's own artifact of that name lives in the same run.
          name: image-sbom
          path: ${{ runner.temp }}/sbom/image.spdx.json
          if-no-files-found: error
          # Kept for a delayed "Re-run failed jobs" of attest-sbom.
          retention-days: 7
          overwrite: true
      - name: Log out
        if: always()
        run: docker logout ghcr.io

  # Attests the file the sbom job made. No checkout, no tool but the pinned
  # actions: this job holds id-token and attestations.
  attest-sbom:
    needs: [publish, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Refuse an image started by anyone but the owner
        if: inputs.owner-only
        run: |
          for a in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            [ "$a" = "$GITHUB_REPOSITORY_OWNER" ] || { echo "::error::$a is not $GITHUB_REPOSITORY_OWNER: only the owner releases"; exit 1; }
          done
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sbom
          path: ${{ runner.temp }}/sbom
      # gh attestation verify oci://... --predicate-type https://spdx.dev/Document/v2.3
      # v4.1.0 has no create-storage-record input; a user-owned repository
      # gets no storage record.
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom/image.spdx.json
          push-to-registry: true
      - name: Log out
        if: always()
        run: docker logout ghcr.io
